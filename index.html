<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blair's Fish ID Game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">

    <!-- Start screen -->
    <section id="start-screen" class="screen active">
      <h1 class="title">🐟 Blair's Fish ID Game 🎣</h1>
      <p class="subtitle">Can you name the fish? Look at the picture and pick the right species!</p>
      <div class="start-options">
        <label for="question-count">How many questions?</label>
        <select id="question-count">
          <option value="5">5 questions</option>
          <option value="10" selected>10 questions</option>
          <option value="20">20 questions</option>
          <option value="50">50 questions</option>
          <option value="all">All the fish!</option>
        </select>
      </div>
      <button id="start-button" class="big-button">Start Fishing!</button>
      <button id="lookup-button" class="big-button secondary-button">🔍 Look up a fish</button>
    </section>

    <!-- Search / browse screen -->
    <section id="search-screen" class="screen">
      <div class="search-bar">
        <button id="search-back" class="quit-button">‹ Back</button>
        <input id="search-input" type="search" autocomplete="off"
               placeholder="Search name, group or species…">
      </div>
      <p id="search-count" class="search-count"></p>
      <div id="search-results" class="search-grid"></div>
    </section>

    <!-- Fish info screen (from search) -->
    <section id="info-screen" class="screen">
      <header class="hud">
        <button id="info-back" class="quit-button">‹ Back to search</button>
      </header>
      <div class="fish-card">
        <img id="info-image" src="" alt="">
      </div>
      <h2 id="info-name" class="info-name"></h2>
      <div class="feedback">
        <div id="info-facts" class="fact-sheet"></div>
      </div>
    </section>

    <!-- Question screen -->
    <section id="question-screen" class="screen">
      <header class="hud">
        <span id="progress">Question 1 of 10</span>
        <span id="score">Score: 0</span>
        <button class="quit-button" data-quit>✕ Quit</button>
      </header>
      <div class="fish-card">
        <img id="fish-image" src="" alt="Fish to identify">
      </div>
      <h2 id="question-text">Which fish is this?</h2>
      <div id="answers" class="answers"></div>
    </section>

    <!-- Fact screen: shown after answering. The Next button stays locked for
         a few seconds so there's time to read the facts before moving on. -->
    <section id="fact-screen" class="screen">
      <header class="hud">
        <span id="fact-progress"></span>
        <span id="fact-score"></span>
        <button class="quit-button" data-quit>✕ Quit</button>
      </header>
      <div class="fish-card">
        <img id="fact-image" src="" alt="">
      </div>
      <div class="feedback">
        <p id="feedback-text"></p>
        <div id="fact-sheet" class="fact-sheet"></div>
      </div>
      <button id="next-button" class="big-button" disabled>Next Fish ➜</button>
    </section>

    <!-- Results screen -->
    <section id="results-screen" class="screen">
      <h1 id="results-title">Great job!</h1>
      <p id="results-score" class="results-score"></p>
      <p id="results-message"></p>
      <button id="play-again-button" class="big-button">Play Again</button>
    </section>

    <!-- Quit confirmation dialog -->
    <div id="quit-overlay" class="overlay hidden">
      <div class="dialog">
        <p class="dialog-title">Quit the game?</p>
        <p class="dialog-text">Your progress this game will be lost.</p>
        <div class="dialog-buttons">
          <button id="quit-cancel" class="big-button dialog-cancel">Keep Playing</button>
          <button id="quit-confirm" class="big-button dialog-confirm">Quit</button>
        </div>
      </div>
    </div>

  </main>

  <script src="data/species.js"></script>
  <script src="data/details.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
